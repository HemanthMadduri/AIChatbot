<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hemanth Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
</div>


  <div class="chat-wrapper">
    <div class="chat-container">
      <div class="chat-header">
        <h2>Hemanth Chatbot</h2>
        <button id="theme-toggle">🌙</button>
      </div>

      <div id="chat-box" class="chat-box"></div>
      
      <!-- Media preview area -->
      <div id="media-preview" class="media-preview"></div>
      
      <div class="input-area">
        <!-- Image upload -->
        <label for="image-input" class="attach-btn" title="Attach image">
          🖼️
        </label>
        <input
          type="file"
          id="image-input"
          accept="image/*"
          hidden
        />
        
        <!-- Video upload -->
        <label for="video-input" class="attach-btn" title="Attach video">
          🎬
        </label>
        <input
          type="file"
          id="video-input"
          accept="video/*"
          hidden
        />
        
        <!-- File upload -->
        <label for="file-input" class="attach-btn" title="Attach file">
          📎
        </label>
        <input
          type="file"
          id="file-input"
          accept=".pdf,.doc,.docx,.txt,.xls,.xlsx,.ppt,.pptx"
          hidden
        />

        <textarea
          id="user-input"
          placeholder="Type your message..."
          rows="1"
        ></textarea>

        <button id="voice-btn" class="voice-btn" title="Click to speak your message">🎤</button>
        <button id="tts-toggle" class="tts-btn" title="Speak replies aloud">🔊</button>
        <button id="send-btn" class="send-btn">➤</button>
      </div>



  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
